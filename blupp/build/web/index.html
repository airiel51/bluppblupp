<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport: standard viewport with no viewport-fit=cover to avoid touch/click coordinate offset -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  
  <!-- SEO: High-ranking title & compelling meta description -->
  <title>Blupp AI Finance — Smart Personal Wealth & Expense Tracking</title>
  <meta name="description" content="Blupp AI Finance is an intelligent personal finance OS featuring automated bank sync, Safe-to-Spend AI radar, smart envelope budgeting, and real-time net worth tracking.">
  <meta name="keywords" content="personal finance, expense tracker, AI finance, net worth tracker, money management, safe to spend, bank sync">
  <meta name="author" content="Blupp AI Inc.">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://blupp.ai/">
  <meta property="og:title" content="Blupp AI Finance — Smart Personal Wealth & Expense Tracking">
  <meta property="og:description" content="Track net worth, predict safe-to-spend balance, and automate your finances with intelligent AI.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://blupp.ai/">
  <meta name="twitter:title" content="Blupp AI Finance — Smart Personal Wealth & Expense Tracking">
  <meta name="twitter:description" content="Track net worth, predict safe-to-spend balance, and automate your finances with intelligent AI.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- Cache control: force revalidation to prevent stale app versions -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Theme color: adapts to dark mode status bar -->
  <meta name="theme-color" content="#09090B">

  <!-- iOS PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blupp">
  <link rel="apple-touch-icon" href="icons/Icon-512.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon Set -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- UTM tracking parameter capture script -->
  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var utmKeys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
        var utmObj = {};
        var found = false;
        utmKeys.forEach(function(k) {
          if (params.has(k)) {
            utmObj[k] = params.get(k);
            found = true;
          }
        });
        if (found) {
          sessionStorage.setItem('blupp_utm', JSON.stringify(utmObj));
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* Prevent white flash on load — lock html & body to prevent browser scroll & touch coordinate offset */
    html, body {
      background-color: #09090B;
      color: #FAFAFA;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Print Stylesheet: clean report format without app chrome */
    @media print {
      body {
        background: #FFFFFF !important;
        color: #09090B !important;
        position: static !important;
        overflow: auto !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <script>
    // Unregister old service workers to prevent stale cache on iOS
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
