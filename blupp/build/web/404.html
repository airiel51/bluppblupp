<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 — Page Not Found | Blupp AI Finance</title>
  <meta name="description" content="The page or route you are looking for does not exist on Blupp AI Finance.">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #09090B;
      color: #FAFAFA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow-x: hidden;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: #18181B;
      border: 1px solid #27272A;
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      color: #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .title {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #FAFAFA 0%, #A1A1AA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .description {
      color: #A1A1AA;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 480px) {
      .actions {
        flex-direction: row;
        justify-content: center;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: #10B981;
      color: #09090B;
    }
    .btn-primary:hover {
      background: #059669;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #27272A;
      color: #FAFAFA;
      border: 1px solid #3F3F46;
    }
    .btn-secondary:hover {
      background: #3F3F46;
      transform: translateY(-1px);
    }
    .contact-links {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #27272A;
      display: flex;
      justify-content: center;
      gap: 18px;
      font-size: 13px;
    }
    .contact-links a {
      color: #10B981;
      text-decoration: none;
      transition: color 0.15s;
    }
    .contact-links a:hover {
      text-decoration: underline;
    }
    .copyright {
      margin-top: 24px;
      color: #71717A;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      404 Error
    </div>

    <h1 class="title">Lost in Cash Flow?</h1>
    <p class="description">
      The financial route or page you were looking for doesn't exist or has moved. Return to your dashboard to keep your money on track.
    </p>

    <div class="actions">
      <a href="./" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Return to Dashboard
      </a>
      <a href="mailto:support@blupp.ai?subject=Blupp%20404%20Error%20Report" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        Report Broken Link
      </a>
    </div>

    <div class="contact-links">
      <a href="mailto:support@blupp.ai">Email Support</a>
      <span style="color:#3F3F46">•</span>
      <a href="tel:+60123456789">Call Hotline</a>
      <span style="color:#3F3F46">•</span>
      <a href="./">Home</a>
    </div>
  </div>

  <div class="copyright">
    &copy; <span id="year">2026</span> Blupp AI Inc. All rights reserved.
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
