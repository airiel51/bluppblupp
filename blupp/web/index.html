<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport: standard viewport with no viewport-fit=cover to avoid touch/click coordinate offset -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  
  <!-- SEO: High-ranking title & compelling meta description -->
  <title>Blupp AI Finance — Smart Personal Wealth & Expense Tracking</title>
  <meta name="description" content="Blupp AI Finance is an intelligent personal finance OS featuring automated bank sync, Safe-to-Spend AI radar, smart envelope budgeting, and real-time net worth tracking.">
  <meta name="keywords" content="personal finance, expense tracker, AI finance, net worth tracker, money management, safe to spend, bank sync">
  <meta name="author" content="Blupp AI Inc.">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://blupp.ai/">
  <meta property="og:title" content="Blupp AI Finance — Smart Personal Wealth & Expense Tracking">
  <meta property="og:description" content="Track net worth, predict safe-to-spend balance, and automate your finances with intelligent AI.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://blupp.ai/">
  <meta name="twitter:title" content="Blupp AI Finance — Smart Personal Wealth & Expense Tracking">
  <meta name="twitter:description" content="Track net worth, predict safe-to-spend balance, and automate your finances with intelligent AI.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- Cache control: force revalidation to prevent stale app versions -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Theme color: adapts to dark mode status bar -->
  <meta name="theme-color" content="#09090B">

  <!-- iOS PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blupp">
  <link rel="apple-touch-icon" href="icons/Icon-512.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon Set -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- UTM tracking parameter capture script -->
  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var utmKeys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
        var utmObj = {};
        var found = false;
        utmKeys.forEach(function(k) {
          if (params.has(k)) {
            utmObj[k] = params.get(k);
            found = true;
          }
        });
        if (found) {
          sessionStorage.setItem('blupp_utm', JSON.stringify(utmObj));
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* Prevent white flash on load — lock html & body to prevent browser scroll & touch coordinate offset */
    html, body {
      background-color: #09090B;
      color: #FAFAFA;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Print Stylesheet: clean report format without app chrome */
    @media print {
      body {
        background: #FFFFFF !important;
        color: #09090B !important;
        position: static !important;
        overflow: auto !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Instant pre-boot splash loader for Web & PWA -->
  <div id="app-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#09090B;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;user-select:none;">
    <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:#141418;border-radius:26px;border:1.2px solid rgba(255,255,255,0.12);box-shadow:0 8px 28px rgba(16,185,129,0.25);">
      <img src="assets/images/blupp_fish_white.png" alt="Blupp" style="width:58px;height:58px;object-fit:contain;" onerror="this.style.display='none';document.getElementById('web-splash-fallback').style.display='block';" />
      <div id="web-splash-fallback" style="display:none;color:#10B981;font-size:32px;">🐟</div>
    </div>
    <div style="margin-top:28px;display:flex;align-items:center;gap:8px;">
      <span style="font-size:38px;font-weight:800;letter-spacing:-1px;color:#FAFAFA;">blupp</span>
      <span style="font-size:11.5px;font-weight:800;color:#FFFFFF;background:linear-gradient(135deg,#10B981,#06B6D4);padding:2px 7px;border-radius:6px;letter-spacing:0.8px;">AI</span>
    </div>
    <div style="margin-top:8px;font-size:11px;font-weight:600;letter-spacing:3.2px;color:#71717A;">INTELLIGENT WEALTH OS</div>
    <div style="margin-top:34px;width:170px;height:4.5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;position:relative;">
      <div style="width:45%;height:100%;background:linear-gradient(90deg,#10B981,#06B6D4);border-radius:3px;animation:webSplashBar 1.6s ease-in-out infinite;"></div>
    </div>
  </div>
  <style>
    @keyframes webSplashBar {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(110%); }
      100% { transform: translateX(250%); }
    }
  </style>

  <script>
    // Remove web pre-boot splash once Flutter renders its initial frame
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('app-splash');
      if (splash) {
        splash.style.transition = 'opacity 0.25s ease-out';
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 250);
      }
    });

    // Unregister old service workers to prevent stale cache on iOS
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
